kind = "web"
previewPath = "/"
title = "WerkParts - Collision Fastener Manager"
version = "1.0.0"
id = "artifacts/werkparts"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19996

[services.development]
run = "pnpm --filter @workspace/werkparts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/werkparts", "run", "build" ]
serve = "static"
publicDir = "artifacts/werkparts/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19996"
BASE_PATH = "/"
